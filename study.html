<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="XDD吧 · 学习资料区 · 学科资料与笔记聚合" />
  <title>XDD吧 · 学习资料区</title>
  <link rel="stylesheet" href="public/theme.css" />
  <link rel="stylesheet" href="public/effects.css" />
  <style>
    /* 快捷导航：首页 / 学习资料 / 专栏 / 站规 */
    .quicknav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 14px 10px;background:var(--bg-soft);border-bottom:1px solid var(--line-soft);position:relative;z-index:20}
    .qn-item{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--text);background:var(--card);border:1px solid var(--line);padding:7px 18px;border-radius:999px;text-decoration:none;transition:color .2s,border-color .2s;box-shadow:var(--shadow-soft)}
    .qn-item:hover{color:var(--accent,#e07a5f);border-color:var(--accent,#e07a5f)}
    .qn-item[data-active]{background:var(--accent,#e07a5f);color:#fff;border-color:var(--accent,#e07a5f)}
    @media(max-width:560px){.quicknav{gap:6px;padding:8px 10px 10px}.qn-item{padding:7px 14px;font-size:12.5px}}

    .study-hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(74,144,196,.16),rgba(46,160,67,.14));border:1px solid rgba(74,144,196,.32);border-radius:16px;padding:20px 22px;margin-bottom:14px}
    .study-hero-title{font-size:22px;font-weight:700;color:var(--text)}
    .study-hero-sub{font-size:13px;color:var(--muted);margin-top:6px;max-width:560px;line-height:1.6}
    .study-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
    .study-toolbar select{background:var(--input-bg);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;font-family:inherit}
    .chip{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;transition:all .15s}
    .chip:hover{color:var(--text);border-color:var(--accent,#e07a5f)}
    .chip.active{background:var(--accent,#e07a5f);color:#fff;border-color:var(--accent,#e07a5f);font-weight:600}

    .feed{margin-top:6px}
    .post-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;opacity:1}
    .post-card.in{opacity:1}
    .post-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
    .nickname{font-weight:600;color:var(--text)}
    .nickname-link{cursor:pointer}
    .nickname-link:hover{color:var(--accent,#e07a5f);text-decoration:underline}
    .post-time{font-size:12px;color:var(--faint);margin-left:auto}
    .post-content{font-size:14.5px;color:var(--text);line-height:1.7;margin:8px 0 10px;white-space:pre-wrap;word-break:break-word}
    .badge{display:inline-flex;align-items:center;font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--muted)}
    .badge.topic{background:rgba(127,127,127,.12)}
    .badge.subject{background:rgba(74,144,196,.14);color:#4a90c4;border:1px solid rgba(74,144,196,.45);cursor:pointer}
    .badge.subject:hover{border-color:var(--accent,#e07a5f);color:var(--accent,#e07a5f)}
    .badge.digest{background:rgba(245,185,66,.16);color:#d99b1f;border:1px solid rgba(245,185,66,.45);font-weight:700}
    .badge.pending-review{background:rgba(255,171,64,.16);color:#e08c1a;border:1px solid rgba(255,171,64,.5)}
    .author-level{font-size:11px;color:var(--accent,#e07a5f);background:rgba(224,122,95,.1);padding:1px 6px;border-radius:999px;margin-left:4px;white-space:nowrap}
    .post-actions{display:flex;flex-wrap:wrap;gap:6px 8px;padding-top:8px;border-top:1px solid var(--line)}
    .act-btn{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid transparent;color:var(--muted);font-size:13px;cursor:pointer;padding:5px 11px;border-radius:999px;transition:all .15s;font-family:inherit}
    .act-btn:hover{background:rgba(127,127,127,.12);color:var(--text)}
    .act-btn.like-btn.active{color:var(--accent,#e07a5f);font-weight:600;border-color:rgba(224,122,95,.35);background:rgba(224,122,95,.08)}
    .act-btn.act-link{text-decoration:none;color:var(--accent,#e07a5f)}
    .act-btn.act-link:hover{background:rgba(224,122,95,.1)}
    .act-btn.fav-btn.active{color:#f5b942;font-weight:700;border-color:rgba(245,185,66,.4);background:rgba(245,185,66,.12)}
    .cmt-num{font-variant-numeric:tabular-nums}
    .post-comments{border-top:1px solid var(--line);padding:10px 0 0;margin-top:8px}
    .post-comments.hidden{display:none}
    .cmt-empty{color:var(--faint);font-size:13px;padding:8px 0}
    .cmt-items{display:block}
    .cmt-compose{margin-top:10px}
    .cmt-item{padding:7px 0;border-bottom:1px dashed var(--line)}
    .cmt-item:last-of-type{border-bottom:none}
    .cmt-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
    .cmt-time{color:var(--faint);font-size:11px}
    .cmt-text{font-size:14px;color:var(--text);margin:3px 0 4px;word-break:break-word;white-space:pre-wrap;line-height:1.6}
    .cmt-reply{background:none;border:none;color:var(--accent,#e07a5f);cursor:pointer;font-size:12px;padding:0}
    .cmt-input{width:100%;box-sizing:border-box;background:var(--input-bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;resize:vertical}
    .cmt-input:focus{outline:none;border-color:var(--accent,#e07a5f)}
    .cmt-row{display:flex;gap:8px;margin-top:6px;align-items:center}
    .cmt-bar{display:flex;align-items:center;gap:8px;margin:6px 0 4px;font-size:12px;color:var(--faint)}
    .cmt-warn{color:#e05e5e;font-size:12px;margin-bottom:6px;min-height:14px}
    .btn{background:var(--accent,#e07a5f);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer}
    .btn.sm{padding:6px 12px}
    .pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px}
    .page-num{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
    .empty{text-align:center;color:var(--faint);padding:30px 0;font-size:14px}
    .empty .emoji{font-size:40px;margin-bottom:10px}
    /* 精华帖光效 */
    .lightfx-card::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 20%,rgba(224,122,95,.10) 45%,rgba(122,162,247,.14) 60%,transparent 85%);background-size:220% 100%;animation:lxShift 3.4s linear infinite;pointer-events:none;z-index:0;border-radius:14px}
    .lightfx-card>*{position:relative;z-index:1}
    @keyframes lxShift{0%{background-position:120% 0}100%{background-position:-120% 0}}
  </style>
  <script src="public/sensitive-words.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="dot"></span>
        XDD吧
        <span class="tag">学习资料区</span>
      </div>
      <div class="spacer"></div>
      <span id="userBar"></span>
      <div id="themeSwitcherHost" style="display:inline-flex"></div>
    </div>
  </header>

  <nav class="quicknav" aria-label="快捷导航">
    <a class="qn-item" href="index.html">🏠 首页</a>
    <a class="qn-item" href="study.html" data-active>📖 学习资料</a>
    <a class="qn-item" href="columns.html">📚 专栏</a>
    <a class="qn-item" href="badges.html">🏅 徽章墙</a>
    <a class="qn-item" href="shop.html">🛒 积分商城</a>
    <a class="qn-item" href="events.html">🎉 活动中心</a>
    <a class="qn-item" href="rules.html">📜 站规</a>
  </nav>

  <main class="wrap" style="max-width:920px">
    <section class="study-hero">
      <div>
        <div class="study-hero-title">📖 学习资料区</div>
        <div class="study-hero-sub">按学科聚合同学们分享的课件、笔记与复习资料。发布需选择学科并经管理员审核通过后才对外可见；作者本人可看到自己的待审帖。</div>
      </div>
      <a class="btn" href="index.html">✍️ 去发布资料</a>
    </section>

    <div class="study-toolbar">
      <select id="subjectFilter"><option value="">全部学科</option></select>
      <button class="chip active" data-sort="latest">🕒 最新</button>
      <button class="chip" data-sort="digest">💎 精选</button>
      <span id="studyCount" style="font-size:12px;color:var(--faint);margin-left:auto"></span>
    </div>

    <div id="studyFeed" class="feed"></div>
    <div id="studyPager" class="pager hidden">
      <button class="btn ghost sm" id="studyPrev">上一页</button>
      <span class="page-num" id="studyPageNum">第 1 页</span>
      <button class="btn ghost sm" id="studyNext">下一页</button>
    </div>
  </main>

  <script src="public/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="public/mentions.js"></script>
  <script src="public/effects.js"></script>
  <script src="public/xdd-live.js"></script>
  <script src="public/study.js"></script>
</body>
</html>
