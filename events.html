<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="XDD吧 · 活动中心 · 抽奖、点赞排行、收藏排行与评论排行活动" />
  <title>XDD吧 · 活动中心</title>
  <link rel="stylesheet" href="public/theme.css" />
  <link rel="stylesheet" href="public/effects.css" />
  <style>
    .quicknav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 14px 10px;background:var(--bg-soft);border-bottom:1px solid var(--line-soft);position:relative;z-index:20}
    .qn-item{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--text);background:var(--card);border:1px solid var(--line);padding:7px 18px;border-radius:999px;text-decoration:none;transition:color .2s,border-color .2s;box-shadow:var(--shadow-soft)}
    .qn-item:hover{color:var(--accent,#e07a5f);border-color:var(--accent,#e07a5f)}
    .qn-item[data-active]{background:var(--accent,#e07a5f);color:#fff;border-color:var(--accent,#e07a5f)}
    @media(max-width:560px){.quicknav{gap:6px;padding:8px 10px 10px}.qn-item{padding:7px 14px;font-size:12.5px}}
    .ev-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    .ev-toolbar input,.ev-toolbar select{background:var(--input-bg);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;font-family:inherit}
    .ev-mask{position:fixed;inset:0;z-index:200;background:rgba(15,15,25,.55);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
    .ev-modal{width:min(640px,96vw);max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:18px}
    .ev-modal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .ev-modal-head h3{margin:0;font-size:17px}
    .ev-modal-close{margin-left:auto;background:none;border:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
    .ev-subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 8px}
    .ev-work{padding:9px 0;border-bottom:1px dashed var(--line)}
    .ev-work:last-child{border-bottom:none}
    .ev-work-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
    .ev-work-body{font-size:12.5px;color:var(--muted);line-height:1.7;white-space:pre-wrap;word-break:break-word;margin-top:3px}
    .ev-count{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
    .ev-count b{color:var(--text)}

    /* ================= 移动端适配 ================= */
    @media(max-width:720px){
      .ev-toolbar{gap:8px}
      .ev-toolbar input,.ev-toolbar select{flex:1 1 140px;min-width:0!important;max-width:100%!important;font-size:16px}
      .ev-subtabs{gap:6px}
      .ev-count{gap:10px}
    }
  </style>
  <script src="public/sensitive-words.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="dot"></span>
        XDD吧
        <span class="tag">活动中心</span>
      </div>
      <div class="spacer"></div>
      <span id="userBar"></span>
      <div id="themeSwitcherHost" style="display:inline-flex"></div>
    </div>
  </header>

  <nav class="quicknav" aria-label="快捷导航">
    <a class="qn-item" href="index.html">🏠 首页</a>
    <a class="qn-item" href="study.html">📖 学习资料</a>
    <a class="qn-item" href="columns.html">📚 专栏</a>
    <a class="qn-item" href="badges.html">🏅 徽章墙</a>
    <a class="qn-item" href="shop.html">🛒 积分商城</a>
    <a class="qn-item" href="events.html" data-active>🎉 活动中心</a>
    <a class="qn-item" href="rules.html">📜 站规</a>
  </nav>

  <main class="wrap" style="max-width:1000px">
    <section class="p4-hero event">
      <div>
        <div class="p4-hero-title">🎉 活动中心</div>
        <div class="p4-hero-sub">参与抽奖、点赞排行、收藏排行与评论排行活动，赢取积分、经验与限定徽章。排行榜类活动在结束后由管理员与创始人确认结算，奖励自动发放到账。</div>
      </div>
      <div class="p4-balance">
        <b id="rewardCount">—</b>
        <span>已获奖次数</span>
      </div>
    </section>

    <div class="p4-tabs">
      <button class="chip active" data-tab="ongoing">🔥 进行中</button>
      <button class="chip" data-tab="ended">🏁 已结束</button>
      <button class="chip" data-tab="rewards">🏆 我的奖励</button>
    </div>

    <section id="paneOngoing">
      <div class="ev-toolbar">
        <input id="evKw" type="text" placeholder="搜索活动标题…" autocomplete="off" style="min-width:200px" />
        <button id="evSearch" class="btn sm">搜索</button>
        <button id="evRefresh" class="btn ghost sm">刷新</button>
      </div>
      <div id="ongoingList" class="p4-grid"></div>
    </section>

    <section id="paneEnded" class="hidden">
      <div id="endedList" class="p4-grid"></div>
    </section>

    <section id="paneRewards" class="hidden">
      <div style="font-size:12px;color:var(--faint);margin-bottom:10px">仅展示已发放的奖励记录；结算完成后奖励会同时发送站内通知。</div>
      <div id="rewardList"></div>
    </section>
  </main>

  <script src="public/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="public/effects.js"></script>
  <script src="public/prestige-fx.js"></script>
  <script src="public/content-gate.js"></script>
  <script src="public/events.js"></script>
</body>
</html>
